<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malnate.domani - Sguardo al Futuro</title>
    <link rel="stylesheet" href="script/base.css?v=2">
    <link rel="stylesheet" href="script/dettaglio-trasform.css?v=2">
</head>
<body>

    <!-- BARRA DI NAVIGAZIONE ORIZZONTALE FISSA CON HAMBURGER -->
    <div class="barra-menu">
        <div class="logo">Malnate<span>.domani</span></div>
        
        <!-- NUOVO: Pulsante Hamburger visibile solo su schermi stretti -->
        <button class="hamburger" id="hamburger-trigger">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="gruppo-pulsanti" id="menu-principale">
            <li><a href="index.html" class="link-menu attivo">Benvenuto</a></li>
            <li><a href="conosci-malnate.html" class="link-menu">Conosci Malnate</a></li>
            <li><a href="conosci-comune.html" class="link-menu">Conosci il Comune</a></li>
           <li><a href="trasformazioni.html" class="link-menu attivo">Idee di Trasformazione</a></li> 
            <li><a href="territorio.html" class="link-menu">Governare il Territorio</a></li>
            <li><a href="criticita.html" class="link-menu">Criticità</a></li>
        </ul>
    </div>

    <!-- CONTENITORE DELLO SLIDER A SCHERMO INTERO -->
    <div class="schermata-confronto">
        
        <!-- Frecce di navigazione laterali -->
        <button id="freccia-sinistra" class="freccia-navigazione">‹</button>
        <button id="freccia-destra" class="freccia-navigazione">›</button>

        <!-- AREA CENTRALIZZATA (Pulsante + Foto + Testi) -->
        <div class="blocco-centrale-slider">
            
            <!-- Spostato qui: il pulsante ora è agganciato sopra l'immagine ed è protetto -->
            <a href="trasformazioni.html" class="pulsante-ritorno">← Torna alle miniature</a>

            <!-- AREA VISIVA DELLA FOTO / VIDEO -->
            <div class="area-visiva-foto" id="box-cliccabile">
                <img id="foto-presente" src="" alt="Presente" class="immagine-scambio visibile">
                <img id="foto-futuro" src="" alt="Futuro" class="immagine-scambio">
                <video id="video-futuro" class="immagine-scambio" muted loop playsinline></video>
            </div>

            <!-- UBICAZIONE E ISTRUZIONE DINAMICA -->
            <div class="pannello-testo">
                <h2 id="testo-luogo">Caricamento...</h2>
                <p id="istruzione-clic">Clicca sulla foto per vedere il futuro</p>
            </div>

        </div>

    </div>

<!-- PRIMA carichiamo la logica globale del menu Hamburger -->
    <script src="script/base.js"></script>

    <!-- Il motore JavaScript che controlla tutto -->
    <script src="script/dettaglio-trasform.js?v=2"></script>
</body>
</html>
